apiVersion: v1
kind: Service
metadata:
  name: simple-web-app-service
  namespace: dev
spec:
  type: LoadBalancer   # This creates an external load balancer
  selector:
    app: web-app       # Matches the label in the Deployment
  ports:
    - protocol: TCP
      port: 80        # Port exposed by the Service
      targetPort: 80    # Port on which the application listens in the Pod
