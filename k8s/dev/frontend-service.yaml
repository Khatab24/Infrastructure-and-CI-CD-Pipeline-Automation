apiVersion: v1
kind: Service
metadata:
  name: simple-web-app-service
  namespace: dev
spec:
  type: NodePort
  selector:
    app: web-app  # Matches the label in the Deployment
  ports:
    - protocol: TCP
      port: 3000       # Port exposed by the Service
      targetPort: 80  # Port on which the application listens in the Pod
      nodePort: 30080   # Port on each Node to expose the Service
