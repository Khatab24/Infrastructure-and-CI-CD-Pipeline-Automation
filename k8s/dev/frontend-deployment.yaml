apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-web-app-deployment
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app  # Ensures the Service targets these Pods
  template:
    metadata:
      labels:
        app: web-app  # Label matches the Service selector
    spec:
      containers:
        - name: redweb
          image: khatab24/simpleweb:latest
         
